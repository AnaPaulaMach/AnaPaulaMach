<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="132" role="img" aria-labelledby="title description">
  <title id="title">Ana Paula Machado</title>
  <desc id="description">Software and AI Developer. Information Systems Analyst. Argentina.</desc>
  <style>
    :root{--panel:#ffffff;--ink:#24292f;--muted:#57606a;--brand:#087f8c}
    .panel{width:calc(100% - 2px);fill:var(--panel);stroke:var(--brand);stroke-width:1.2}
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .name{fill:var(--ink);font-size:24px;font-weight:500}
    .role{fill:var(--brand);font-size:16px;font-weight:400}
    .meta{fill:var(--muted);font-size:14px;font-weight:400}
    .static-role{display:none}
    @media(prefers-color-scheme:dark){:root{--panel:#0d1117;--ink:#e6edf3;--muted:#a1acb8;--brand:#67e8f9}}
    @media(prefers-reduced-motion:reduce){.motion-role{display:none}.static-role{display:inline}}
  </style>
  <defs>
    <clipPath id="reveal"><rect x="18" y="50" width="210" height="25"><animate attributeName="width" values="0;210;210;0" keyTimes="0;0.42;0.9;1" dur="8s" repeatCount="indefinite" begin="0s"/></rect></clipPath>
  </defs>
  <rect class="panel" x="1" y="1" height="130" rx="10"/>
  <text class="name" x="18" y="40">Ana Paula Machado</text>
  <g class="motion-role" clip-path="url(#reveal)"><text class="role" x="18" y="68">Software &amp; AI Developer</text></g>
  <text class="role static-role" x="18" y="68">Software &amp; AI Developer</text>
  <text class="meta" x="18" y="94">Information Systems Analyst</text>
  <text class="meta" x="18" y="114">Argentina</text>
</svg>
