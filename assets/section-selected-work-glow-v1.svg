<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="40" role="img" aria-labelledby="title">
  <title id="title">Selected work</title>
  <style>
    :root{--ink:#24292f;--brand:#087f8c}
    text{fill:var(--ink);font:500 24px -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
    .rule{fill:var(--brand)}
    @media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--brand:#67e8f9}}
    @media(prefers-reduced-motion:reduce){.motion{display:none}}
  </style>
  <text x="0" y="25">Selected work</text>
  <rect class="rule" x="0" y="37" width="100%" height="1"/>
  <defs><filter id="soft" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
  <g class="motion"><rect class="rule" x="0" y="37" width="100%" height="1" filter="url(#soft)" opacity="0.1"><animate attributeName="opacity" values="0.05;0.4;0.05" dur="5s" repeatCount="indefinite"/></rect></g>
</svg>
