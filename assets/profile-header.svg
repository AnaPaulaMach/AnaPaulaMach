<svg xmlns="http://www.w3.org/2000/svg" width="660" height="176" viewBox="0 0 660 176" role="img" aria-labelledby="title description">
  <title id="title">Ana Paula Machado</title>
  <desc id="description">Software and AI Developer. Information Systems Analyst. Argentina.</desc>
  <style>
    :root{--panel:#ffffff;--ink:#24292f;--muted:#57606a;--brand:#087f8c}
    .panel{fill:var(--panel);stroke:var(--brand);stroke-width:1.5}
    .name{fill:var(--ink);font:600 32px 'Segoe UI',Arial,sans-serif}
    .role{fill:var(--brand);font:500 20px Consolas,'Liberation Mono',monospace}
    .meta{fill:var(--muted);font:400 13px 'Segoe UI',Arial,sans-serif}
    .static-role{display:none}
    @media(prefers-color-scheme:dark){:root{--panel:#0d1117;--ink:#e6edf3;--muted:#a1acb8;--brand:#67e8f9}}
    @media(prefers-reduced-motion:reduce){.motion-role{display:none}.static-role{display:inline}}
  </style>
  <defs>
    <clipPath id="reveal"><rect x="28" y="72" width="302" height="30"><animate attributeName="width" values="0;302;302;0" keyTimes="0;0.42;0.9;1" dur="8s" repeatCount="indefinite" begin="0s"/></rect></clipPath>
  </defs>
  <rect class="panel" x="1" y="1" width="658" height="174" rx="14"/>
  <text class="name" x="28" y="55">Ana Paula Machado</text>
  <g class="motion-role" clip-path="url(#reveal)"><text class="role" x="28" y="94">Software &amp; AI Developer</text></g>
  <text class="role static-role" x="28" y="94">Software &amp; AI Developer</text>
  <text class="meta" x="28" y="137">Information Systems Analyst · Argentina</text>
</svg>
